	  <div class="art-container">
		<h2>a outra forma de arte</h2>
	  
		<!-- imagem do carro que "segue" o h2 -->
		<div class="car-follow">
		  <img src="img/carropreto.png" alt="carro linha">
		</div>
	  </div>
	  <script>
		document.addEventListener('DOMContentLoaded', () => {
		  const art = document.querySelector('.art-container');
		  if (!art) return;
		
		  const h2 = art.querySelector('h2');
		  const carWrap = art.querySelector('.car-follow');
		  if (!h2 || !carWrap) return;
		
		  let start = 0, end = 0;
		  const maxScale = 3.0;   // escala máxima (1 -> maxScale)
		  const moveUp = 180;     // quantos px sobe enquanto aumenta
		  const fadeAtEnd = true; // se true, desaparece quando progress == 1
		
		  // recalcula os pontos de início/fim (chama em load/resize)
		  function recalc() {
			const h2Rect = h2.getBoundingClientRect();
			const h2TopDoc = h2Rect.top + window.scrollY;
			// quando o efeito começa: quando o h2 estiver ~40% do topo do viewport
			start = h2TopDoc - window.innerHeight * 0.6;
			// quando o efeito termina: um pouco depois do h2 ter passado
			end = h2TopDoc + h2.offsetHeight + 220;
		  }
		  recalc();
		  window.addEventListener('resize', recalc);
		
		  // rAF scroll handler para performance
		  let ticking = false;
		  window.addEventListener('scroll', () => {
			if (!ticking) {
			  window.requestAnimationFrame(update);
			  ticking = true;
			}
		  }, {passive: true});
		
		  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
		
		  function update() {
			ticking = false;
			const scroll = window.scrollY;
			let progress = (scroll - start) / (end - start);
			progress = clamp(progress, 0, 1);
		
			// calcula transform
			const scale = 1 + progress * (maxScale - 1);
			const ty = -progress * moveUp; // sobe à medida que aumenta
		
			carWrap.style.transform = `translate(-50%, ${ty}px) scale(${scale})`;
		
			// controla aparecimento: fica visível enquanto progress < 1,
			// quando atinge 1 desaparece (podes alterar para um fade se preferires)
			if (fadeAtEnd) {
			  carWrap.style.opacity = progress < 1 ? '1' : '0';
			} else {
			  carWrap.style.opacity = '1';
			}
		  }
		
		  // correr uma vez para definir estado inicial
		  update();
		});
		</script>
